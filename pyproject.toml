[project]
name = "simmanager"
version = "0.1.0"
description = "Local monitor for CFD simulations (CONVERGE, OpenFOAM) running on remote HPC clusters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "aiosqlite>=0.20",
    "asyncssh>=2.24.1",
    "fastapi>=0.162.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
simman = "simmanager.cli.main:app"

# External plugins register themselves here:
# [project.entry-points."simmanager.plugins"]
# my-plugin = "my_package.plugin:MyPlugin"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not slow'"
faulthandler_timeout = 30
markers = [
    "slow: slow integration tests against local samples/ files (run with -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH", "N"]
ignore = [
    "RUF001", # ambiguous unicode in strings (Italian text in messages is fine)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/simmanager"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["simmanager.kernel.*", "simmanager.contracts.*"]
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
